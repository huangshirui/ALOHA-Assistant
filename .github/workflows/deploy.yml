name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository intentionally has no lockfile yet; switch this to npm ci
      # when package-lock.json is committed, matching ci.yml.
      - name: Install dependencies
        run: npm install

      - name: Verify repository
        run: npm run check

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Build Web for production
        run: npm run build:web

      - name: Deploy Agent Control
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/agent-control
          command: deploy

      - name: Deploy Gateway with Web static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gateway
          command: deploy

      - name: Verify deployed M1 runtime path
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          workers_subdomain_response="$(
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          workers_subdomain="$(
            printf '%s' "$workers_subdomain_response" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || typeof payload.result?.subdomain !== "string") {
                  process.exit(1);
                }
                process.stdout.write(payload.result.subdomain);
              });
            '
          )"

          gateway_url="https://aloha-gateway.${workers_subdomain}.workers.dev"
          echo "::add-mask::${gateway_url}"
          ALOHA_GATEWAY_URL="$gateway_url" npm run verify:m1-runtime
