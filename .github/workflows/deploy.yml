name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository intentionally has no lockfile yet; switch this to npm ci
      # when package-lock.json is committed, matching ci.yml.
      - name: Install dependencies
        run: npm install

      - name: Verify repository
        run: npm run check

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Ensure Edge Worker deployment name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          workers_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers"

          if curl --fail --silent --show-error \
            "${workers_api}/aloha-edge" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            >/dev/null 2>&1; then
            echo "aloha-edge already exists; no Worker rename is required."
            exit 0
          fi

          old_worker_response="$(
            curl --fail-with-body --silent --show-error \
              "${workers_api}/aloha-gateway" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          old_worker_id="$(
            printf '%s' "$old_worker_response" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || typeof payload.result?.id !== "string") {
                  process.exit(1);
                }
                process.stdout.write(payload.result.id);
              });
            '
          )"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "${workers_api}/${old_worker_id}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"aloha-edge"}' \
            >/dev/null

          echo "Renamed aloha-gateway Worker deployment to aloha-edge."

      - name: Build Web for production
        run: npm run build:web

      - name: Deploy Agent Control
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/agent-control
          command: deploy

      - name: Ensure internal capability signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          secrets_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aloha-agent-control/secrets"
          current_secrets="$(
            curl --fail-with-body --silent --show-error \
              "$secrets_url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          has_signing_key="$(
            printf '%s' "$current_secrets" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || !Array.isArray(payload.result)) {
                  process.exit(1);
                }
                process.stdout.write(
                  payload.result.some((item) => item?.name === "CAPABILITY_GRANT_SIGNING_KEY")
                    ? "yes"
                    : "no",
                );
              });
            '
          )"

          if [ "$has_signing_key" = "no" ]; then
            capability_signing_key="$(openssl rand -hex 32)"
            secret_payload="$(
              CAPABILITY_SIGNING_KEY="$capability_signing_key" node -e '
                process.stdout.write(JSON.stringify({
                  name: "CAPABILITY_GRANT_SIGNING_KEY",
                  type: "secret_text",
                  text: process.env.CAPABILITY_SIGNING_KEY,
                }));
              '
            )"

            curl --fail-with-body --silent --show-error \
              --request PUT \
              "$secrets_url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$secret_payload" \
              >/dev/null

            unset capability_signing_key secret_payload
            echo "Initialized CAPABILITY_GRANT_SIGNING_KEY on Agent Control."
          else
            echo "CAPABILITY_GRANT_SIGNING_KEY already exists; preserving the existing value."
          fi

      - name: Deploy ALOHA Edge with Web static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gateway
          command: deploy

      - name: Resolve deployed Edge URL
        id: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          workers_subdomain_response="$(
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          workers_subdomain="$(
            printf '%s' "$workers_subdomain_response" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || typeof payload.result?.subdomain !== "string") {
                  process.exit(1);
                }
                process.stdout.write(payload.result.subdomain);
              });
            '
          )"

          edge_url="https://aloha-edge.${workers_subdomain}.workers.dev"
          echo "::add-mask::${edge_url}"
          echo "url=${edge_url}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed M1 runtime path
        env:
          ALOHA_GATEWAY_URL: ${{ steps.edge.outputs.url }}
        run: npm run verify:m1-runtime

      - name: Verify deployed M2 capability path
        env:
          ALOHA_GATEWAY_URL: ${{ steps.edge.outputs.url }}
        run: npm run verify:m2-runtime
