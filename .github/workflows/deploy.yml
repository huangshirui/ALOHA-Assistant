name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aloha-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository intentionally has no lockfile yet; switch this to npm ci
      # when package-lock.json is committed, matching ci.yml.
      - name: Install dependencies
        run: npm install

      - name: Verify repository
        run: npm run check

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Build Web for production
        run: npm run build:web

      - name: Deploy Agent Control
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/agent-control
          command: deploy

      - name: Ensure internal capability signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          secrets_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aloha-agent-control/secrets"
          current_secrets="$(
            curl --fail-with-body --silent --show-error \
              "$secrets_url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          has_signing_key="$(
            printf '%s' "$current_secrets" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || !Array.isArray(payload.result)) {
                  process.exit(1);
                }
                process.stdout.write(
                  payload.result.some((item) => item?.name === "CAPABILITY_GRANT_SIGNING_KEY")
                    ? "yes"
                    : "no",
                );
              });
            '
          )"

          if [ "$has_signing_key" = "no" ]; then
            capability_signing_key="$(openssl rand -hex 32)"
            secret_payload="$(
              CAPABILITY_SIGNING_KEY="$capability_signing_key" node -e '
                process.stdout.write(JSON.stringify({
                  name: "CAPABILITY_GRANT_SIGNING_KEY",
                  type: "secret_text",
                  text: process.env.CAPABILITY_SIGNING_KEY,
                }));
              '
            )"

            curl --fail-with-body --silent --show-error \
              --request PUT \
              "$secrets_url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$secret_payload" \
              >/dev/null

            unset capability_signing_key secret_payload
            echo "Initialized CAPABILITY_GRANT_SIGNING_KEY on Agent Control."
          else
            echo "CAPABILITY_GRANT_SIGNING_KEY already exists; preserving the existing value."
          fi

      - name: Detect trusted LifeSpace Identity activation
        id: identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          secrets_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aloha-agent-control/secrets"
          current_secrets="$(
            curl --fail-with-body --silent --show-error \
              "$secrets_url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          identity_state="$(
            printf '%s' "$current_secrets" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || !Array.isArray(payload.result)) {
                  process.exit(1);
                }
                const names = new Set(payload.result.map((item) => item?.name));
                const hasBase = names.has("LIFESPACE_IDENTITY_BASE_URL");
                const hasCredential = names.has("LIFESPACE_APPLICATION_CREDENTIAL");
                process.stdout.write(
                  hasBase && hasCredential ? "active" : hasBase || hasCredential ? "partial" : "legacy",
                );
              });
            '
          )"

          case "$identity_state" in
            active)
              echo "active=true" >> "$GITHUB_OUTPUT"
              echo "Trusted LifeSpace Identity configuration detected."
              ;;
            legacy)
              echo "active=false" >> "$GITHUB_OUTPUT"
              echo "LifeSpace Identity is not activated; legacy M1/M2 deployment smoke remains enabled."
              ;;
            partial)
              echo "Agent Control LifeSpace Identity configuration is partial; refusing deployment verification." >&2
              exit 1
              ;;
            *)
              echo "Unexpected LifeSpace Identity configuration state." >&2
              exit 1
              ;;
          esac

      - name: Deploy Gateway with Web static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gateway
          command: deploy

      - name: Resolve deployed Gateway URL
        id: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          workers_subdomain_response="$(
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          workers_subdomain="$(
            printf '%s' "$workers_subdomain_response" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const payload = JSON.parse(input);
                if (payload.success !== true || typeof payload.result?.subdomain !== "string") {
                  process.exit(1);
                }
                process.stdout.write(payload.result.subdomain);
              });
            '
          )"

          gateway_url="https://aloha-gateway.${workers_subdomain}.workers.dev"
          echo "::add-mask::${gateway_url}"
          echo "url=${gateway_url}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed M1 runtime path (legacy pre-M3)
        if: steps.identity.outputs.active != 'true'
        env:
          ALOHA_GATEWAY_URL: ${{ steps.gateway.outputs.url }}
        run: npm run verify:m1-runtime

      - name: Verify deployed M2 capability path (legacy pre-M3)
        if: steps.identity.outputs.active != 'true'
        env:
          ALOHA_GATEWAY_URL: ${{ steps.gateway.outputs.url }}
        run: npm run verify:m2-runtime

      - name: Require authenticated M1/M2/M3 acceptance in trusted mode
        if: steps.identity.outputs.active == 'true'
        run: |
          echo "Trusted LifeSpace Identity is active."
          echo "Unauthenticated legacy deployment smoke is intentionally disabled."
          echo "Complete the short-lived Access-authenticated M1, M2 and M3 acceptance gates documented in docs/m3-deployment-activation.md."
